name: BACAPI
version: '${version}'

main: lukagi.BACAPI
api-version: '1.20.4'
load: STARTUP

authors: [ Lukagi ]

commands:
  bacapi:
    description: Commandes de gestion du plugin BACAPI
    usage: /bacapi <reload|status|test|debug>
    permission: bacapi.admin
    permission-message: "§cPermission refusée : bacapi.admin requise"

permissions:
  bacapi.admin:
    description: Accès aux commandes d'administration BACAPI
    default: op