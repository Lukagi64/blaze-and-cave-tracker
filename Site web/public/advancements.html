<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advancements - Blaze&Cave Tracker</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <strong>Blaze&Cave Tracker</strong>
    <nav>
      <a href="./index.html">Accueil</a>
      <a href="./streamers.html">Streamers</a>
      <a href="./advancements.html" class="active">Advancements</a>
    </nav>
  </header>

  <main>
    <h1>Suivi des Advancements</h1>

    <section class="filters-bar">
      <input type="search" id="filter-search" placeholder="Rechercher un advancement...">
      <select id="filter-category">
        <option value="">Toutes les catégories</option>
      </select>
      <select id="filter-difficulty">
        <option value="">Toutes les difficultés</option>
        <option value="vert">Vert (Task)</option>
        <option value="bleu">Bleu (Goal)</option>
        <option value="violet">Violet (Challenge)</option>
      </select>
      <select id="filter-player">
        <option value="">Tous les joueurs</option>
      </select>
      <select id="filter-status">
        <option value="all">Tous les statuts</option>
        <option value="completed">Terminés uniquement</option>
        <option value="uncompleted">Non terminés uniquement</option>
      </select>
    </section>

    <p id="stats-summary" class="stats-summary">Chargement des données...</p>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Catégorie</th>
            <th>Difficulté</th>
            <th>Complété par</th>
            <th>Date (Premier / Sélectionné)</th>
          </tr>
        </thead>
        <tbody id="advancements-tbody"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <a href="/mentions.html">Mentions légales</a>
  </footer>

  <script src="/js/advancements.js"></script>
</body>
</html>
