# ============================================
# docker-compose.override.yml - Développement local
# Ce fichier est automatiquement fusionné avec docker-compose.yml
# NE PAS COMMITTER si contient des secrets réels
# ============================================

services:
  web-api:
    build:
      target: builder  # Utilise le stage builder avec toutes les devDependencies
    command: npm run dev  # Nécessite "dev": "node --watch src/server.js" dans package.json
    environment:
      - NODE_ENV=development
    volumes:
      # Hot reload : le code source est monté depuis l'hôte
      - ./src:/app/src
      - ./public:/app/public
      - ./db:/app/db
      # node_modules N'EST PAS monté (celui du container est utilisé)
      # Pour éviter les conflits, on masque node_modules de l'hôte
      - /app/node_modules
    # En dev, on n'a pas besoin de healthcheck agressif
    healthcheck:
      disable: true
    # Ports déjà définis dans docker-compose.yml
    # deploy.resources non nécessaire en dev