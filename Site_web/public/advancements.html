<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advancements — Blaze & Cave's Tracker</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <span class="logo-icon">⛏️</span>
                Blaze & Cave's Tracker
            </h1>
            <nav class="nav">
                <a href="/index.html" class="nav-link">Accueil</a>
                <a href="/streamers.html" class="nav-link">Streamers</a>
                <a href="/advancements.html" class="nav-link active">Advancements</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <header class="page-header">
                <h1>Tous les Advancements</h1>
                <p id="advancementsCount">Chargement...</p>
            </header>

            <form class="filters" id="filtersForm">
                <div class="filter-group">
                    <label for="filterSearch">Recherche</label>
                    <input type="text" id="filterSearch" name="search" placeholder="Nom ou clé technique...">
                </div>

                <div class="filter-group">
                    <label for="filterCategory">Catégorie</label>
                    <select id="filterCategory" name="category">
                        <option value="">Toutes</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterDifficulty">Difficulté</label>
                    <select id="filterDifficulty" name="difficulty">
                        <option value="">Toutes</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterPlayer">Joueur</label>
                    <select id="filterPlayer" name="player">
                        <option value="">Tous (sans progression)</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterCompleted">Statut</label>
                    <select id="filterCompleted" name="completed">
                        <option value="">Tous</option>
                        <option value="true">Finis seulement</option>
                        <option value="false">Non finis seulement</option>
                    </select>
                </div>

                <div class="filter-group" style="align-self: flex-end;">
                    <button type="button" id="clearFilters" class="btn btn--outline">Réinitialiser</button>
                </div>
            </form>

            <div class="advancements-grid" id="advancementsGrid">
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Blaze & Cave's Advancements Pack Tracker — Made for Omeega's Community</p>
        </div>
    </footer>

    <script src="/advancements.js"></script>
</body>
</html>
